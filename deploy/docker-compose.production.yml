services:
  postgres:
    image: postgres:16.15-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientpulse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-clientpulse}
    command: >
      postgres
      -c shared_buffers=64MB
      -c work_mem=4MB
      -c max_connections=50
      -c maintenance_work_mem=16MB
      -c effective_cache_size=256MB
    volumes:
      - clientpulse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-clientpulse_admin} -d $${POSTGRES_DB:-clientpulse}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - clientpulse_data_internal

  api:
    image: clientpulse-api:${VERSION:-v1.0.0}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://mindu.ir}
      APP_BASE_URL: ${PUBLIC_APP_URL:-https://mindu.ir}
      API_BASE_URL: ${PUBLIC_APP_URL:-https://mindu.ir}
      API_PORT: "8080"
      DATABASE_URL: ${DATABASE_URL}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-fa}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Tehran}
      EMAIL_PROVIDER: disabled
      TELEGRAM_MODE: disabled
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/data/storage
      WORKER_HEARTBEAT_TIMEOUT_SECONDS: "10"
    ports:
      - "127.0.0.1:8090:8080"
    volumes:
      - clientpulse_storage:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
    restart: unless-stopped
    networks:
      - clientpulse_app_internal
      - clientpulse_data_internal

  worker:
    image: clientpulse-worker:${VERSION:-v1.0.0}
    entrypoint: ["/app/worker"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-https://mindu.ir}
      DATABASE_URL: ${WORKER_DATABASE_URL}
      WORKER_DATABASE_URL: ${WORKER_DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      WORKER_HEARTBEAT_TIMEOUT_SECONDS: "10"
      CHECK_RESULT_RETENTION_DAYS: "90"
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-Asia/Tehran}
      EMAIL_PROVIDER: disabled
      TELEGRAM_MODE: disabled
    healthcheck:
      test: ["CMD-SHELL", "pidof worker || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 192M
        reservations:
          memory: 64M
    restart: unless-stopped
    networks:
      - clientpulse_data_internal
      - clientpulse_egress

  web:
    image: clientpulse-web:${VERSION:-v1.0.0}
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_APP_URL:-https://mindu.ir}
    ports:
      - "127.0.0.1:3100:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 96M
    restart: unless-stopped
    networks:
      - clientpulse_app_internal

volumes:
  clientpulse_postgres_data:
    name: clientpulse_postgres_data
    driver: local
  clientpulse_storage:
    name: clientpulse_storage
    driver: local

networks:
  clientpulse_app_internal:
    name: clientpulse_app_internal
    driver: bridge
  clientpulse_data_internal:
    name: clientpulse_data_internal
    internal: true
  clientpulse_egress:
    name: clientpulse_egress
    driver: bridge

