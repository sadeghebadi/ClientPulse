services:
  postgres:
    image: postgres:16-alpine
    container_name: clientpulse_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-clientpulse}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientpulse} -d ${POSTGRES_DB:-clientpulse}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - clientpulse-network

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: clientpulse_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      API_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-clientpulse}:${POSTGRES_PASSWORD:-clientpulse_dev_password}@postgres:5432/${POSTGRES_DB:-clientpulse}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-replace-with-cryptographic-random-value-in-prod}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:-dev-token-pepper-replace-with-cryptographic-random-value-in-prod}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - clientpulse-network

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    container_name: clientpulse_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://${POSTGRES_USER:-clientpulse}:${POSTGRES_PASSWORD:-clientpulse_dev_password}@postgres:5432/${POSTGRES_DB:-clientpulse}?sslmode=disable
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
    restart: unless-stopped
    networks:
      - clientpulse-network

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    container_name: clientpulse_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      PORT: "3000"
    ports:
      - "${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - clientpulse-network

  mailpit:
    image: axllent/mailpit:latest
    container_name: clientpulse_mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - clientpulse-network

volumes:
  postgres_data:
    driver: local

networks:
  clientpulse-network:
    driver: bridge

