services:
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: clientpulse_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clientpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clientpulse_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-clientpulse}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clientpulse} -d ${POSTGRES_DB:-clientpulse}"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - clientpulse-network

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    container_name: clientpulse_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      API_PORT: "8080"
      DATABASE_URL: postgres://clientpulse_app:clientpulse_app_dev_password@postgres:5432/${POSTGRES_DB:-clientpulse}?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://${POSTGRES_USER:-clientpulse}:${POSTGRES_PASSWORD:-clientpulse_dev_password}@postgres:5432/${POSTGRES_DB:-clientpulse}?sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET:-dev-session-secret-replace-with-cryptographic-random-value-in-prod}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:-dev-token-pepper-replace-with-cryptographic-random-value-in-prod}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@clientpulse.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ClientPulse Alerts}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-none}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ClientPulseAlertsBot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-disabled}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_LOCAL_DIR: /app/data/storage
      WORKER_HEARTBEAT_TIMEOUT_SECONDS: "${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-10}"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - storage_data:/app/data/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - clientpulse-network

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    container_name: clientpulse_worker
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: postgres://clientpulse_worker:clientpulse_worker_dev_password@postgres:5432/${POSTGRES_DB:-clientpulse}?sslmode=disable
      WORKER_DATABASE_URL: postgres://clientpulse_worker:clientpulse_worker_dev_password@postgres:5432/${POSTGRES_DB:-clientpulse}?sslmode=disable
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-10}
      WORKER_HEARTBEAT_TIMEOUT_SECONDS: "${WORKER_HEARTBEAT_TIMEOUT_SECONDS:-10}"
      CHECK_RESULT_RETENTION_DAYS: "${CHECK_RESULT_RETENTION_DAYS:-90}"
      DEFAULT_TIMEZONE: ${DEFAULT_TIMEZONE:-UTC}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-none}
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-notifications@clientpulse.local}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-ClientPulse Alerts}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-none}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ClientPulseAlertsBot}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-polling}
      TELEGRAM_POLL_TIMEOUT_SECONDS: ${TELEGRAM_POLL_TIMEOUT_SECONDS:-50}
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-}
    restart: unless-stopped
    networks:
      - clientpulse-network

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    container_name: clientpulse_web
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
      PORT: "3000"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    restart: unless-stopped
    networks:
      - clientpulse-network

  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: clientpulse_mailpit
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped
    networks:
      - clientpulse-network

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local

networks:
  clientpulse-network:
    driver: bridge
